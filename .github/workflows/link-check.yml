name: Link check

# Referral and signup links rot fast. Once a month, build the site and check
# every external link; open (or update) an issue listing the broken ones.
on:
  schedule:
    - cron: '17 6 3 * *' # 3rd of every month, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Only absolute http(s) links; sites that block bots (403/429) are not failures.
          # --root-dir turns internal links (/energia/) into file:// URLs, which
          # the http(s) scheme filter then skips; Gatsby already guarantees them.
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/public
            --scheme https --scheme http
            --accept 200..=206,403,429
            --max-concurrency 4
            --timeout 30
            --retry-wait-time 5
            --exclude '^https?://(www\.)?nomasibex35\.com'
            --exclude '^https?://(www\.)?googletagmanager\.com'
            --exclude '^https?://github\.com/alexrodba/nomasibex35/issues/new'
            --exclude '^https?://ui\.awin\.com'
            'public/**/*.html'
          fail: false
          output: lychee-report.md

      - name: Open or update the issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: 'Enlaces rotos detectados por la comprobación mensual'
          content-filepath: lychee-report.md
          labels: enlaces-rotos, mantenimiento
          issue-number: ${{ vars.LINK_CHECK_ISSUE }}
